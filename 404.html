<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page not found — CycleVault</title>
<script>
// Send near-miss paths (typos, wrong case, missing letters) to the closest real page.
(function () {
  var pages = ["keypress-sweeps"];
  var p = location.pathname.toLowerCase().replace(/^\/+|\/+$/g, "").split("/")[0].replace(/[^a-z0-9]/g, "");
  if (!p) return;
  function dist(a, b) {
    var d = [], i, j;
    for (i = 0; i <= a.length; i++) d[i] = [i];
    for (j = 0; j <= b.length; j++) d[0][j] = j;
    for (i = 1; i <= a.length; i++)
      for (j = 1; j <= b.length; j++)
        d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    return d[a.length][b.length];
  }
  var best = null, bestD = 99;
  pages.forEach(function (pg) {
    var k = pg.replace(/[^a-z0-9]/g, ""), dd = dist(p, k);
    if (k.indexOf(p) === 0 && p.length >= 4) dd = 0;           // a prefix like "keypress"
    if (p.indexOf("sweep") >= 0 || p.indexOf("keyp") >= 0) dd = Math.min(dd, 1);
    if (dd < bestD) { bestD = dd; best = pg; }
  });
  if (best && bestD <= Math.max(3, Math.floor(p.length / 3)))
    location.replace("/" + best + "/" + location.search + location.hash);
})();
</script>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--muted:#666;--link:#0b5fff}
@media (prefers-color-scheme:dark){:root{--bg:#111;--fg:#eee;--muted:#aaa;--link:#7aa7ff}}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:560px;margin:18vh auto 0;padding:0 16px}
h1{font-size:24px;margin:0 0 8px}p{color:var(--muted);margin:0 0 6px}a{color:var(--link)}
</style>
</head>
<body>
<main>
<h1>Page not found</h1>
<p>Try <a href="/keypress-sweeps/">Building Three Keypress Sweeps for TUI Testing</a> or the <a href="/">home page</a>.</p>
</main>
</body>
</html>
